name: Bootstrap lockfile

on:
  push:
    branches:
      - task/bootstrap-sanitized-baseline

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/bootstrap-sanitized-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@10 --activate
      - run: pnpm install --lockfile-only
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/bootstrap-lockfile.yml
          git commit -m "chore: generate sanitized lockfile"
          git push
