name: Sync Playwright lockfile

on:
  pull_request:
    branches:
      - task/final-verification

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'task/sync-playwright-lockfile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: task/sync-playwright-lockfile

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: sync Playwright lockfile'
          git push
