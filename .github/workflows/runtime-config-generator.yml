name: Inspect runtime config package

on:
  pull_request:
    branches:
      - task/final-verification

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v6
        with:
          ref: task/runtime-config-generator

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show generated Nx project
        run: pnpm nx show project @application-template/runtime-config --json
