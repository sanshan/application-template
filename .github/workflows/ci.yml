name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: application_template
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d application_template"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: application_template

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm nx run-many -t lint

      - name: Run type checks
        run: pnpm nx run-many -t typecheck

      - name: Run database migrations
        run: pnpm nx run @application-template/api:migration:run

      - name: Run unit and integration tests
        run: pnpm nx run-many -t test

      - name: Build applications
        run: pnpm nx run-many -t build

      - name: Verify API startup
        shell: bash
        run: |
          pnpm nx run @application-template/api:serve > /tmp/api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:3000/api; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: Verify Web startup
        shell: bash
        run: |
          pnpm nx run @application-template/web:serve > /tmp/web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://localhost:4200; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web.log
          exit 1
